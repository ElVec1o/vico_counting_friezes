name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lean:
    name: Lean library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/download/v3.1.1/elan-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch Mathlib cache
        working-directory: lean
        run: lake exe cache get

      - name: Build
        working-directory: lean
        run: lake build VicoEnum

      - name: Assert the library is sorry-free
        working-directory: lean
        run: |
          if grep -rn --include='*.lean' '\bsorry\b' VicoEnum/; then
            echo "::error::a sorry is present in the library"
            exit 1
          fi
          echo "no sorry found"

      - name: Audit the axiom base
        working-directory: lean
        run: |
          cat > /tmp/axioms.lean <<'EOF'
          import VicoEnum
          #print axioms VicoEnum.width4_card
          #print axioms VicoEnum.width5_bound
          #print axioms VicoEnum.width6_bound
          #print axioms VicoEnum.width6_bound_entry
          #print axioms VicoEnum.width7_bound_p3
          #print axioms VicoEnum.no_pos_rat_root
          #print axioms VicoEnum.palindromic_iff
          #print axioms VicoEnum.lattice_criterion
          #print axioms VicoEnum.Qp_eq_card
          #print axioms VicoEnum.Q_conv_cube_eq_sigma_conv_square
          #print axioms VicoEnum.W5_setOf_eq_box
          #print axioms VicoEnum.T5_five
          #print axioms VicoEnum.paper_count
          #print axioms VicoEnum.paper_frieze5_count
          #print axioms VicoEnum.T5_eq_five_add_five_mul
          #print axioms VicoEnum.W5box_IsMp_count
          #print axioms VicoEnum.orb_IsMp_card
          #print axioms VicoEnum.acount_eq
          #print axioms VicoEnum.T5_sum_ford
          #print axioms VicoEnum.w5_iff_ford
          #print axioms VicoEnum.div_gcd_dvd_of_w5
          #print axioms VicoEnum.allint_card
          #print axioms VicoEnum.not_four_integral
          #print axioms VicoEnum.fordParam_iff
          #print axioms VicoEnum.T5_squarefree
          #print axioms VicoEnum.ford_min_bound
          #print axioms VicoEnum.ford_sum_five_dvd
          #print axioms VicoEnum.support_iff_dvd_sq
          #print axioms VicoEnum.W5_diag_iff
          #print axioms VicoEnum.W5_diag_shift
          #print axioms VicoEnum.path_count_of_T5
          #print axioms VicoEnum.card_swap_parity
          #print axioms VicoEnum.support_card_eq_Qp
          #print axioms VicoEnum.T5_mod_ten
          #print axioms VicoEnum.ten_dvd_T5_iff
          #print axioms VicoEnum.width6_master
          #print axioms VicoEnum.W6_of_red6
          #print axioms VicoEnum.red6_of_W6
          #print axioms VicoEnum.quid5_cycle
          #print axioms VicoEnum.quid5_two_eq_zero_iff
          #print axioms VicoEnum.quid5_four_eq_zero_iff
          #print axioms VicoEnum.fdet_step
          #print axioms VicoEnum.fpath_det
          #print axioms VicoEnum.pentagon_closes
          #print axioms VicoEnum.plucker
          #print axioms VicoEnum.path_minor
          #print axioms VicoEnum.path_frieze_minor
          #print axioms VicoEnum.fdet_pos_iff
          #print axioms VicoEnum.clockwise_frieze_pos
          #print axioms VicoEnum.fdet_recurrence
          #print axioms VicoEnum.recurrence_unique
          #print axioms VicoEnum.frieze_col_eq_fdet
          #print axioms VicoEnum.ford_general
          #print axioms VicoEnum.ford_determines_l
          #print axioms VicoEnum.ford_degenerate_branch
          #print axioms VicoEnum.ford_min_norm_bound
          #print axioms VicoEnum.plucker3
          #print axioms VicoEnum.path_recurrence_forced
          #print axioms VicoEnum.path_recurrence_forced_of_dvd
          #print axioms VicoEnum.fdet_smul_eq
          #print axioms VicoEnum.span_of_coprime_dets
          #print axioms VicoEnum.transfer_of_same_frieze
          #print axioms VicoEnum.fdet_sl2_invariant
          #print axioms VicoEnum.cubic_slice_factor
          #print axioms VicoEnum.complement_congr
          #print axioms VicoEnum.slice_divisor_congr
          #print axioms VicoEnum.slice_divisor_dvd
          #print axioms VicoEnum.solution_of_divisor
          #print axioms VicoEnum.path_from_frieze
          #print axioms VicoEnum.vertex_exists_iff
          #print axioms VicoEnum.second_coord_integral
          #print axioms VicoEnum.two_column
          #print axioms VicoEnum.sum_dvd_of_dvd
          #print axioms VicoEnum.initial_pair_congruence
          #print axioms VicoEnum.e_exists
          #print axioms VicoEnum.transferMap_add
          #print axioms VicoEnum.transferMap_smul
          #print axioms VicoEnum.transferMap_apply
          #print axioms VicoEnum.transferMap_det
          #print axioms VicoEnum.fdet_linear_map
          #print axioms VicoEnum.transferMap_matrix
          #print axioms VicoEnum.fibre_eq_orbit
          #print axioms VicoEnum.paper_count4
          #print axioms VicoEnum.friezes4_ncard
          #print axioms VicoEnum.friezes5_ncard
          #print axioms VicoEnum.five_dvd_friezes5
          #print axioms VicoEnum.ten_dvd_friezes5_prime
          #print axioms VicoEnum.w5cond_converse
          #print axioms VicoEnum.intcount_frieze
          #print axioms VicoEnum.intcount_five_frieze
          #print axioms VicoEnum.width6_fourth
          #print axioms VicoEnum.cc6_isFrieze
          #print axioms VicoEnum.modhyp_card
          #print axioms VicoEnum.factorization_dM
          #print axioms VicoEnum.dM_dvd_iff
          EOF
          lake env lean /tmp/axioms.lean | tee /tmp/axioms.out
          if grep -vE '^.*(depends on axioms: \[propext(, Classical\.choice)?(, Quot\.sound)?\]|does not depend on any axioms)$' /tmp/axioms.out; then
            echo "::error::a declaration depends on a non-standard axiom"
            exit 1
          fi

  scripts:
    name: Verification scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Closed forms at widths 4 and 5
        working-directory: code
        run: timeout 1800 python3 verify_width5_palindromic.py

      - name: Proved-complete T(N,5) for N <= 40
        working-directory: code
        run: timeout 1800 python3 verify_width5_proved.py 40

      - name: Proved-complete T(N,6) for N <= 12
        working-directory: code
        run: timeout 1800 python3 verify_width6_proved.py 12

      - name: Independent cross-checks on the width-6 enumeration
        working-directory: code
        run: timeout 1800 python3 crosscheck_width6.py 6

      - name: The uniform bound, widths 4 to 7
        working-directory: code
        run: timeout 1800 python3 max_numerator.py
